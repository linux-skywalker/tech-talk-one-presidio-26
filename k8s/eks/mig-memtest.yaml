# MIG memory test (EKS). UNTESTED. Same pods as k8s/mps-memtest.yaml. Each pod requests one MIG slice (mig.strategy=single advertises slices as nvidia.com/gpu).
# "greedy" allocates 1 GiB chunks until it fails and holds them. "steady" holds 3 GiB, then at t=60 s tries to grow by 2 GiB.
# Expected with MIG: each pod sees only its own slice, greedy stops at the slice limit, steady grows. Replace ACCOUNT_ID and REGION.
apiVersion: v1
kind: Pod
metadata: {name: mem-steady, labels: {app: memtest}}
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: t
    image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/gpu-train:v1
    command: ["python", "-c"]
    args:
    - |
      import torch, time
      f, t = torch.cuda.mem_get_info(); print(f"steady sees free={f/2**30:.1f} total={t/2**30:.1f} GiB", flush=True)
      x = torch.empty(3 * 2**30, dtype=torch.uint8, device="cuda"); print("steady holds 3 GiB", flush=True)
      time.sleep(60)
      try:
          z = torch.empty(2 * 2**30, dtype=torch.uint8, device="cuda"); print("steady GREW by 2 GiB: OK", flush=True)
      except Exception as e:
          print(f"steady could NOT grow by 2 GiB: {type(e).__name__}", flush=True)
      time.sleep(20)
    resources: {limits: {nvidia.com/gpu: 1}}
---
apiVersion: v1
kind: Pod
metadata: {name: mem-greedy, labels: {app: memtest}}
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: t
    image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/gpu-train:v1
    command: ["python", "-c"]
    args:
    - |
      import torch, time
      f, t = torch.cuda.mem_get_info(); print(f"greedy sees free={f/2**30:.1f} total={t/2**30:.1f} GiB", flush=True)
      time.sleep(15)
      held = []
      try:
          while True:
              held.append(torch.empty(2**30, dtype=torch.uint8, device="cuda"))
      except Exception as e:
          print(f"greedy stopped at {len(held)} GiB: {type(e).__name__}", flush=True)
      time.sleep(120)
    resources: {limits: {nvidia.com/gpu: 1}}
