# Our own MIG layouts for one H100 80GB (p5.4xlarge), so profile names do not depend on the Operator's auto-generated config.
# Applied by scripts/eks/session.sh operator (before the helm install) and referenced with migManager.config.name. Key must be config.yaml.
# H100 80GB profiles: 1g.10gb max 7, 2g.20gb max 3, 3g.40gb max 2, 7g.80gb max 1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-mig-parted-config
  namespace: gpu-operator
data:
  config.yaml: |-
    version: v1
    mig-configs:
      all-disabled:
      - devices: all
        mig-enabled: false
      all-1g.10gb:
      - devices: all
        mig-enabled: true
        mig-devices:
          "1g.10gb": 7
      all-2g.20gb:
      - devices: all
        mig-enabled: true
        mig-devices:
          "2g.20gb": 3
