# kube-prometheus-stack, trimmed for a single node. Scrapes the Operator's DCGM exporter.
alertmanager: {enabled: false}
nodeExporter: {enabled: false}
kubeStateMetrics: {enabled: false}
defaultRules: {create: false}
prometheus:
  prometheusSpec:
    retention: 6h
    resources: {requests: {memory: 256Mi}}
    additionalScrapeConfigs:
    - job_name: dcgm
      scrape_interval: 5s
      static_configs:
      - targets: ["nvidia-dcgm-exporter.gpu-operator.svc:9400"]
grafana:
  adminPassword: admin
  service: {type: NodePort, nodePort: 30300}
  defaultDashboardsEnabled: false
  dashboards:
    default:
      nvidia-dcgm:
        gnetId: 12239
        revision: 2
        datasource: Prometheus
