# Second, smaller workload for the sharing demo: Qwen2.5-0.5B on the same GPU as k8s/serve-deployment.yaml (needs time slicing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serve-small
spec:
  replicas: 1
  strategy: {type: Recreate}   # one GPU: old pod must release it before the new one starts
  selector:
    matchLabels: {app: serve-small}
  template:
    metadata:
      labels: {app: serve-small}
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: localhost:5000/gpu-serve:v1
        env:
        - {name: MODEL, value: Qwen/Qwen2.5-0.5B-Instruct}
        - {name: ADAPTER, value: /none}
        - {name: GPU_UTIL, value: "0.3"}
        ports:
        - containerPort: 8000
        volumeMounts:
        - {name: work, mountPath: /work}
        readinessProbe:
          httpGet: {path: /v1/models, port: 8000}
          periodSeconds: 5
        startupProbe:
          httpGet: {path: /v1/models, port: 8000}
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            nvidia.com/gpu: 1
      volumes:
      - name: work
        persistentVolumeClaim: {claimName: work}
---
apiVersion: v1
kind: Service
metadata:
  name: serve-small
spec:
  type: NodePort
  selector: {app: serve-small}
  ports:
  - {port: 8000, targetPort: 8000, nodePort: 30081}
