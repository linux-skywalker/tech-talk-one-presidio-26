# One NodePort per serve-tiny pod (30090-30095) so each copy can be tested alone. Used by scripts/loadtest-light.sh
apiVersion: v1
kind: Service
metadata:
  name: serve-tiny-0
spec:
  type: NodePort
  selector: {statefulset.kubernetes.io/pod-name: serve-tiny-0}
  ports:
  - {port: 8000, targetPort: 8000, nodePort: 30090}
---
