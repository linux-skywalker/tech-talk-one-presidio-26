# Advertise 1 physical GPU as 2 schedulable nvidia.com/gpu (time slicing, no memory isolation).
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-2
  namespace: gpu-operator
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 2
