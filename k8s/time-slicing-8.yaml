# Advertise 1 physical GPU as 8 schedulable nvidia.com/gpu. No memory isolation: pods share VRAM and time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-8
  namespace: gpu-operator
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 8
